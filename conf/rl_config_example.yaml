# Example YAML configuration for RslRlOnPolicyRunnerCfg
# This demonstrates how to override RL training settings via YAML

experiment_name: "g1_tracking_custom"

# Policy settings
policy:
  init_noise_std: 1.0
  actor_obs_normalization: true
  critic_obs_normalization: true
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: "elu"

# Algorithm settings
algorithm:
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.005
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: "adaptive"
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0

# Training settings
save_interval: 500
num_steps_per_env: 24
max_iterations: 6000
device: "cuda:0"

# Logging and debugging
empirical_normalization: false
normalize_input: false
normalize_advantage: true
use_wandb: false
wandb_entity: null
wandb_project: null
