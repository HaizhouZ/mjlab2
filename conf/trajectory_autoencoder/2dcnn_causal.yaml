# @package _global_
defaults:
  - config

architecture: "2dcnn_causal"
latent_dim: 128
output_dir: "logs/trajectory_autoencoder/2dcnn_causal"

# Causal 2D CNN specific parameters
model:
  encoder_channels: [32, 64, 128, 256]
  decoder_channels: [256, 128, 64, 32]
  kernel_size: 3
  use_batch_norm: true
