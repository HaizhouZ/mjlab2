# @package _global_
defaults:
  - config

architecture: "unet"
latent_dim: 128
output_dir: "logs/trajectory_autoencoder/unet"

# U-Net specific parameters
model:
  encoder_channels: [1024, 1024, 512, 512, 256, 256]
  decoder_channels: [256, 256, 512, 512, 1024, 1024]
  use_batch_norm: true
  dropout: 0.0