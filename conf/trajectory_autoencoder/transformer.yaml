# @package _global_
defaults:
  - _self_
  - config

architecture: "transformer"
latent_dim: 128
output_dir: "logs/trajectory_autoencoder/transformer"

# Transformer specific parameters
model:
  transformer:
    d_model: 256
    nhead: 8
    num_encoder_layers: 4
    num_decoder_layers: 4
    dim_feedforward: 1024
    dropout: 0.1
    activation: "relu"
